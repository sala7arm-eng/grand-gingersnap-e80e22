<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="application-name" content="The Hunt v3.8.1"><title>Create a lobby · The Hunt</title><link rel="stylesheet" href="style.css"></head><body data-init="initCreateLobby"><header><strong>◉ THE HUNT</strong><div class="top"><span class="muted">PLAYER: <b data-player></b></span><button class="secondary" onclick="location.href='home.html'">Home</button><button class="secondary" onclick="location.href='instructions.html'">How to play</button><button class="secondary" onclick="location.href='settings.html'" data-i18n="Settings">Settings</button><button class="secondary" data-logout data-i18n="Log out">Log out</button></div></header><main><section class="hero"><div class="eyebrow">CREATE LOBBY</div><h1>CREATE A <span style="color:var(--green)">LOBBY.</span></h1><p id="createLobbyHelp">Choose a lobby name, code, and whether anyone can join.</p></section><section class="panel"><form id="lobbyForm"><label>Lobby name</label><input id="lobbyName" required maxlength="40" placeholder="Friday Night Hunt"><label>Lobby access</label><div class="access-switch" role="group" aria-label="Lobby access"><button type="button" class="access-choice" data-access="open" aria-pressed="true">Open</button><button type="button" class="access-choice" data-access="private" aria-pressed="false">Private</button></div><p id="accessHelp" class="muted">Open lobbies appear in the public list. Players can join without entering a code.</p><label for="lobbyCode">Lobby code name</label><input id="lobbyCode" required minlength="3" maxlength="12" placeholder="HUNT24"><p class="muted" id="codeHelp">Keep the code for private invitations. Open lobbies can be joined from the list.</p><button type="submit">Create lobby</button> <a class="button secondary" href="home.html">Cancel</a></form></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
